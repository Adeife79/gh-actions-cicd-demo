name: Full CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
  
    env:
      AWS_REGION: eu-west-1
      S3_BUCKET_NAME: "gh-actions-demo1-tf-state-bucket"
      DOCKER_IMAGE: adeife08/recipe-app:v2

    steps:
    - name: Checkout code
      uses: actions/checkout@4

    - name: Configure AWS Crdentials
      uses: aws-actions/configure-aws-credentials@4
      with:
        role-to-assume: arn:aws:iam::749929394992:role/gh-actions-role 
        aws-region: ${{env.AWS_REGION}}
      
    - name: Create S3 Backend
      run: |
        aws s3api create-bucket --bucket "${{ env.S3_BUCKET_NAME}}" --region ${{env.AWS_REGION}}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init -backend-config="bucket=${{env.S3_BUCKET_NAME}}" -backend-config="region=${{env.AWS_REGION}}"

    - name: Terraform Plan
      run: terraform Plan

    - name: Terraform Apply
      run: |
       terraform apply -auto-approve
       terraform output -raw private_key > private_key.pem
       chmod 600 private_key.pem

       APP_IP=$(terraform output -raw app_public_ip)
       echo "APP_IP=$APP_IP" >> $GIHUB_ENV

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}

    - name: Build and Push Docker Image
      run: |
        docker build -t recipe-app:v2 .
        docker tag recipe-app:v2 ${{env.DOCKER_IMAGE}}
        docker push ${{env.DOCKER_IMAGE}}

#    - name: Login to Docker Hub
#      run: echo "${{secrets.DOCKER_PASSWORD}}" | docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin

#    - name: Get EC2 IP
#      id: tf 
#      run: echo "ip=$(terraform output -raw app_public_ip)" >> $GITHUB_OUTPUT

#    - name: Setup SSH Key
    

#    - name: Wait for EC2
#      run: sleep 60

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{env.APP_IP}}
        username: ec2-user
        key_path: ./private_key.pem
        script: |
          sudo docker login -u ${{secrets.DOCKERHUB_USERNAME}} -p ${{secrets.DOCKERHUB_PASSWORD}}
          sudo docker pull ${{env.DOCKER_IMAGE}}
          sudo docker stop app || true
          sudo docker rm app || true
          sudo docker run -d --name recipe-app -p 8090:80 ${{env.DOCKER_IMAGE}}

